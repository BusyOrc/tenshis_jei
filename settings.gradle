        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/maven' }
        maven { url = 'https://maven.parchmentmc.org' }
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'net.neoforged.moddev.legacyforge' version '2.0.86'
    }
}

rootProject.name = 'tenshis_jei_addon-forge-1.20.1'